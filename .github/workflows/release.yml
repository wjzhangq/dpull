name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version metadata
        id: meta
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and package dpull and mpull
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          EXT="${{ matrix.ext }}"
          LDFLAGS="-s -w \
            -X github.com/wjzhangq/dpull/pkg/version.Version=${VERSION} \
            -X github.com/wjzhangq/dpull/pkg/version.Commit=${{ steps.meta.outputs.commit }} \
            -X github.com/wjzhangq/dpull/pkg/version.BuildDate=${{ steps.meta.outputs.date }}"
          mkdir -p dist/build
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/build/dpull${EXT}" ./cmd/dpull
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/build/mpull${EXT}" ./cmd/mpull
          for tool in dpull mpull; do
            NAME="${tool}_${VERSION}_${GOOS}_${GOARCH}"
            mkdir -p "dist/${NAME}"
            cp "dist/build/${tool}${EXT}" "dist/${NAME}/${tool}${EXT}"
            cp README.md LICENSE "dist/${NAME}/"
            if [ "${GOOS}" = "windows" ]; then
              (cd dist && zip -r "${NAME}.zip" "${NAME}")
            else
              (cd dist && tar -czf "${NAME}.tar.gz" "${NAME}")
            fi
            ls -lh "dist/${NAME}"
          done
          echo "ARTIFACT_NAME=${GOOS}-${GOARCH}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve version
        id: meta
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: Release ${{ steps.meta.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            `dpull` 下载 Docker 镜像，`mpull` 下载 Hugging Face / HF-Mirror / ModelScope。两个工具各自一个压缩包。

            | 系统 | dpull | mpull |
            | --- | --- | --- |
            | Linux x86_64 | `dpull_${{ steps.meta.outputs.version }}_linux_amd64.tar.gz` | `mpull_${{ steps.meta.outputs.version }}_linux_amd64.tar.gz` |
            | Linux arm64 | `dpull_${{ steps.meta.outputs.version }}_linux_arm64.tar.gz` | `mpull_${{ steps.meta.outputs.version }}_linux_arm64.tar.gz` |
            | macOS Intel | `dpull_${{ steps.meta.outputs.version }}_darwin_amd64.tar.gz` | `mpull_${{ steps.meta.outputs.version }}_darwin_amd64.tar.gz` |
            | macOS Apple Silicon | `dpull_${{ steps.meta.outputs.version }}_darwin_arm64.tar.gz` | `mpull_${{ steps.meta.outputs.version }}_darwin_arm64.tar.gz` |
            | Windows x86_64 | `dpull_${{ steps.meta.outputs.version }}_windows_amd64.zip` | `mpull_${{ steps.meta.outputs.version }}_windows_amd64.zip` |
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
