name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version metadata
        id: meta
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build dpull and mpull
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          NAME="dpull_${{ steps.meta.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${NAME}"
          LDFLAGS="-s -w \
            -X github.com/wjzhangq/dpull/pkg/version.Version=${{ steps.meta.outputs.version }} \
            -X github.com/wjzhangq/dpull/pkg/version.Commit=${{ steps.meta.outputs.commit }} \
            -X github.com/wjzhangq/dpull/pkg/version.BuildDate=${{ steps.meta.outputs.date }}"
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/${NAME}/dpull${{ matrix.ext }}" ./cmd/dpull
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/${NAME}/mpull${{ matrix.ext }}" ./cmd/mpull
          cp README.md LICENSE "dist/${NAME}/"
          echo "ARTIFACT_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Package
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "${ARTIFACT_NAME}.zip" "${ARTIFACT_NAME}"
          else
            tar -czf "${ARTIFACT_NAME}.tar.gz" "${ARTIFACT_NAME}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve version
        id: meta
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: Release ${{ steps.meta.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            每个压缩包里同时有 `dpull`（Docker 镜像）和 `mpull`（Hugging Face / HF-Mirror / ModelScope）。

            | 系统 | 文件 |
            | --- | --- |
            | Linux x86_64 | `dpull_${{ steps.meta.outputs.version }}_linux_amd64.tar.gz` |
            | Linux arm64 | `dpull_${{ steps.meta.outputs.version }}_linux_arm64.tar.gz` |
            | macOS Intel | `dpull_${{ steps.meta.outputs.version }}_darwin_amd64.tar.gz` |
            | macOS Apple Silicon | `dpull_${{ steps.meta.outputs.version }}_darwin_arm64.tar.gz` |
            | Windows x86_64 | `dpull_${{ steps.meta.outputs.version }}_windows_amd64.zip` |

            Linux / macOS 解压后把 `dpull` 和 `mpull` 放到 `PATH`。Windows 解压后得到 `dpull.exe` 和 `mpull.exe`。
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
